<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGraph - Automated Diagramming Engine</title>

    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>

    <style>
        /* --- GLOBAL STYLES --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            margin: 0;
            padding: 20px 40px;
        }

        h1,
        h3 {
            margin-top: 0;
        }

        hr {
            border: 0;
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }

        /* --- CONFIG PANEL --- */
        .config-panel {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }

        .config-row {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            resize: vertical;
        }

        .color-pickers {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .color-item {
            display: flex;
            flex-direction: column;
            font-size: 14px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #45a049;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* --- 30/70 SPLIT LAYOUT --- */
        .editor-container {
            display: flex;
            gap: 20px;
            height: 600px;
            /* Fixed height just like the Streamlit version */
        }

        .code-col {
            flex: 3;
            /* 30% width */
            display: flex;
            flex-direction: column;
        }

        .diagram-col {
            flex: 7;
            /* 70% width */
            display: flex;
            flex-direction: column;
        }

        #mermaid-code {
            flex-grow: 1;
            font-family: "Courier New", Courier, monospace;
            background: #f4f4f4;
            white-space: pre;
        }

        #diagram-preview {
            flex-grow: 1;
            border: 1px solid #ddd;
            border-radius: 8px;

            /* The Mermaid Live "Infinite Grid" Effect */
            background-color: #fcfcfc;
            background-image: radial-gradient(#d0d0d0 1px, transparent 1px);
            background-size: 20px 20px;

            overflow: hidden;
            position: relative;
            cursor: grab;
            /* Shows a hand icon for dragging */
        }

        #diagram-preview:active {
            cursor: grabbing;
            /* Closes the hand when clicking/dragging */
        }

        /* --- EXPORT BUTTONS --- */
        .export-panel {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>AutoGraph - Automated Diagramming Engine</h1>
    <hr>

    <div class="config-panel">
        <h3>Configuration & Input Logic</h3>
        <textarea id="user-text" rows="5">To make coffee: Grind beans. Boil water. Pour water over grounds.</textarea>

        <div class="config-row">
            <div>
                <label><b>Orientation:</b></label><br>
                <select id="orientation" style="padding: 5px; margin-top: 5px;">
                    <option value="TD">Top-Down (Vertical)</option>
                    <option value="LR">Left-Right (Horizontal)</option>
                </select>
            </div>

            <div class="color-pickers">
                <div class="color-item"><label>Action</label><input type="color" id="col-action" value="#4CAF50"></div>
                <div class="color-item"><label>Decision</label><input type="color" id="col-decision" value="#2196F3">
                </div>
                <div class="color-item"><label>Start</label><input type="color" id="col-start" value="#9C27B0"></div>
                <div class="color-item"><label>End</label><input type="color" id="col-end" value="#F44336"></div>
                <div class="color-item"><label>Text</label><input type="color" id="col-text" value="#ffffff"></div>
            </div>

            <div style="margin-top: 10px; font-size: 14px; display: flex; align-items: center; gap: 5px;">
                <input type="checkbox" id="unified-colors">
                <label for="unified-colors">Use Action colour for Start and End nodes</label>
            </div>

            <div style="margin-left: auto;">
                <button id="btn-generate">Generate Flowchart</button>
            </div>
        </div>
        <div id="status-msg" style="color: #d32f2f; margin-top: 10px; font-weight: bold;"></div>
    </div>

    <div class="editor-container">
        <div class="code-col">
            <h3>Code</h3>
            <textarea id="mermaid-code">graph TD&#10; A["Start"] --> B["Your Flowchart"]</textarea>
        </div>
        <div class="diagram-col">
            <h3>Preview</h3>
            <div id="diagram-preview"></div>
        </div>
    </div>

    <div class="export-panel">
        <button id="btn-download" style="background-color: #2196F3;">Download PNG</button>
        <button id="btn-live">Open in Mermaid Live</button>
    </div>

    <script>
        // Initialize Mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: 'default',
            flowchart: { htmlLabels: false } // <-- This stops the text from getting cut off
        });

        let panZoomInstance = null;
        let renderCounter = 0;

        // --- DYNAMIC COLOR APPLIER ---
        function applyColorsToMermaid(code) {
            const unifiedColors = document.getElementById('unified-colors').checked;

            const actionCol = document.getElementById('col-action').value;
            const decisionCol = document.getElementById('col-decision').value;
            const textCol = document.getElementById('col-text').value;

            // If unified is checked, override Start/End with the Action color
            const startCol = unifiedColors ? actionCol : document.getElementById('col-start').value;
            const endCol = unifiedColors ? actionCol : document.getElementById('col-end').value;

            // Strip existing styles
            const lines = code.split('\n').filter(l => !l.trim().startsWith('style '));
            if (lines.length <= 1) return code;

            let nodeIds = [], decisionNodes = new Set(), outgoing = new Set(), seen = new Set();
            const nodeRegex = /\b([A-Za-z_]\w*)\s*[\[{\(]/g;
            const diamondRegex = /\b([A-Za-z_]\w*)\s*\{/g;
            const arrowRegex = /\b([A-Za-z_]\w*)\s*(?:\[[^\]]*\]|\{[^\}]*\}|\([^\)]*\))?\s*--/g;

            // Parse nodes
            lines.slice(1).forEach(line => {
                let match;
                const nodeRx = new RegExp(nodeRegex);
                while ((match = nodeRx.exec(line)) !== null) {
                    if (!seen.has(match[1]) && !["graph", "flowchart", "style", "classDef", "click"].includes(match[1])) {
                        seen.add(match[1]); nodeIds.push(match[1]);
                    }
                }
                const diamondRx = new RegExp(diamondRegex);
                while ((match = diamondRx.exec(line)) !== null) decisionNodes.add(match[1]);

                const arrowRx = new RegExp(arrowRegex);
                while ((match = arrowRx.exec(line)) !== null) outgoing.add(match[1]);
            });

            const terminalNodes = new Set([...nodeIds].filter(x => !outgoing.has(x)));
            const startNode = nodeIds.length > 0 ? nodeIds[0] : null;

            let styleLines = [];
            nodeIds.forEach(id => {
                let color = actionCol;
                if (id === startNode) color = startCol;
                else if (terminalNodes.has(id)) color = endCol;
                else if (decisionNodes.has(id)) color = decisionCol;
                styleLines.push(`style ${id} fill:${color},color:${textCol},stroke:${color}`);
            });

            return [...lines, ...styleLines].join('\n');
        }

        // --- RENDER FUNCTION ---
        async function renderDiagram() {
            const rawCode = document.getElementById('mermaid-code').value;
            const coloredCode = applyColorsToMermaid(rawCode);
            const container = document.getElementById('diagram-preview');

            try {
                // Clear old diagram and pan/zoom instance
                if (panZoomInstance) {
                    panZoomInstance.destroy();
                    panZoomInstance = null;
                }
                container.innerHTML = '';

                // Use a unique ID each time to avoid mermaid re-render conflicts
                renderCounter++;
                const { svg } = await mermaid.render(`mermaid-svg-${renderCounter}`, coloredCode);
                container.innerHTML = svg;
                // Grab the newly generated SVG
                const svgElement = container.querySelector('svg');

                // 1. DESTROY MERMAID'S INVISIBLE WALLS
                svgElement.removeAttribute('width');
                svgElement.removeAttribute('height');
                svgElement.removeAttribute('style'); // Clears any inline max-width Mermaid injected

                // 2. Force the SVG window to fill our 70% column
                svgElement.style.width = '100%';
                svgElement.style.height = '100%';

                // 3. Initialize the Infinite Camera
                panZoomInstance = svgPanZoom(svgElement, {
                    zoomEnabled: true,
                    controlIconsEnabled: true,
                    fit: true,
                    center: true,
                    minZoom: 0.1,  // Allow zooming way out
                    maxZoom: 50,   // Allow zooming way in
                    zoomScaleSensitivity: 0.2
                });

            } catch (err) {
                console.error(err);
                container.innerHTML = `<div style="color:red; padding: 20px;">Syntax Error in Mermaid Code</div>`;
            }
        }

        // --- EVENT LISTENERS ---

        // --- EVENT LISTENERS ---

        // Handle Unified Colors Checkbox
        document.getElementById('unified-colors').addEventListener('change', (e) => {
            const isChecked = e.target.checked;
            // Disable/Enable the color pickers visually
            document.getElementById('col-start').disabled = isChecked;
            document.getElementById('col-end').disabled = isChecked;

            // Re-render the diagram instantly
            renderDiagram();
        });

        // Live update when typing in the code editor
        document.getElementById('mermaid-code').addEventListener('input', renderDiagram);

        // Update colors when pickers change
        ['col-action', 'col-decision', 'col-start', 'col-end', 'col-text'].forEach(id => {
            document.getElementById(id).addEventListener('input', renderDiagram);
        });

        // Generate Button (API Call)
        document.getElementById('btn-generate').addEventListener('click', async () => {
            const btn = document.getElementById('btn-generate');
            const statusMsg = document.getElementById('status-msg');
            const userText = document.getElementById('user-text').value;
            const orientation = document.getElementById('orientation').value;

            btn.disabled = true;
            btn.innerText = "Talking to Backend...";
            statusMsg.innerText = "";

            try {
                // IMPORTANT: Ensure your backend URL is correct here
                const response = await fetch('http://127.0.0.1:5000/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: userText, orientation: orientation })
                });

                if (!response.ok) throw new Error("Backend Error");

                const data = await response.json();
                document.getElementById('mermaid-code').value = data.mermaid_code;
                renderDiagram();

            } catch (err) {
                statusMsg.innerText = "Connection failed. Is the backend running?";
            } finally {
                btn.disabled = false;
                btn.innerText = "Generate Flowchart";
            }
        });

        // Export to Mermaid Live
        document.getElementById('btn-live').addEventListener('click', () => {
            const code = applyColorsToMermaid(document.getElementById('mermaid-code').value);
            const state = { code: code, mermaid: { theme: 'default' } };
            const b64 = btoa(JSON.stringify(state));
            window.open(`https://mermaid.live/edit#base64:${b64}`, '_blank');
        });

        // Download PNG
        // Download PNG Logic
        document.getElementById('btn-download').addEventListener('click', async () => {
            const btn = document.getElementById('btn-download');
            const originalText = btn.innerText;
            btn.innerText = "Generating...";
            btn.disabled = true;

            try {
                // 1. Get the colored Mermaid code
                const coloredCode = applyColorsToMermaid(document.getElementById('mermaid-code').value);

                // 2. Use a unique ID so Mermaid doesn't crash on repeat downloads
                const uniqueId = 'export-' + Date.now();
                const { svg } = await mermaid.render(uniqueId, coloredCode);

                // 3. Create a temporary container to parse the SVG
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = svg;
                const svgElem = tempDiv.querySelector('svg');

                // 4. Safely extract exact dimensions from the viewBox
                const viewBox = svgElem.getAttribute('viewBox').split(' ');
                const width = parseFloat(viewBox[2]);
                const height = parseFloat(viewBox[3]);
                
                // Force dimensions and white background
                svgElem.setAttribute('width', width);
                svgElem.setAttribute('height', height);
                svgElem.style.backgroundColor = '#ffffff';
                
                // CRITICAL: Force XML namespaces
                svgElem.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
                svgElem.setAttribute('xmlns:xhtml', 'http://www.w3.org/1999/xhtml'); // Fixes HTML nodes

                // 5. Convert SVG to string
                let svgData = new XMLSerializer().serializeToString(svgElem);
                
                // ANTI-TAINTING FIX: Strip external Google Fonts that Mermaid injects
                svgData = svgData.replace(/@import\s+url\([^)]+\);?/g, '');

                // Convert to Base64
                const base64Data = btoa(unescape(encodeURIComponent(svgData)));
                const imgSource = `data:image/svg+xml;base64,${base64Data}`;

                // 6. Draw to Canvas and Download
                const img = new Image();
                img.crossOrigin = "Anonymous"; // ANTI-TAINTING FIX for Safari
                
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    
                    // Multiply by 2 for High-Resolution Export!
                    canvas.width = width * 2; 
                    canvas.height = height * 2;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.scale(2, 2); // Scale the drawing context
                    ctx.drawImage(img, 0, 0);

                    // Trigger the download
                    const a = document.createElement('a');
                    a.href = canvas.toDataURL('image/png');
                    a.download = 'autograph-diagram.png';
                    a.click();

                    // Cleanup
                    btn.innerText = originalText;
                    btn.disabled = false;
                };
                
                img.onerror = () => {
                    alert("Browser failed to parse the SVG data.");
                    btn.innerText = originalText;
                    btn.disabled = false;
                };

                img.src = imgSource;

            } catch (err) {
                console.error("Export failed:", err);
                alert("Failed to generate image. Check console for details.");
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        // Initial Render
        renderDiagram();
    </script>
</body>

</html>
